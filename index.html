<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ELIXIR SB STORE - Premium Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a0f1e 0%, #0f172a 100%);
            padding: 20px;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .header h1 {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2rem;
        }

        .tagline {
            color: #94a3b8;
            margin-top: 8px;
        }

        .social-header {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .social-icon {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .social-icon.discord { background: #5865F2; }
        .social-icon.tiktok { background: #000000; border: 1px solid #fe2c55; }

        .tab-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255,215,0,0.2);
            padding: 12px 28px;
            font-weight: bold;
            border-radius: 50px;
            color: #94a3b8;
            cursor: pointer;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffb347);
            color: #0f172a;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-panel.active-panel {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            text-align: center;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 1.6rem;
            margin-bottom: 25px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,215,0,0.15);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,215,0,0.4);
        }

        .card-header {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,180,71,0.05));
            padding: 18px 20px;
            border-bottom: 1px solid rgba(255,215,0,0.1);
        }

        .product-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
        }

        .rating {
            color: #ffd700;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .card-body {
            padding: 20px;
        }

        .option-item {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            padding: 12px 15px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .option-item.selected {
            background: rgba(255,215,0,0.15);
            border-color: #ffd700;
        }

        .option-title {
            font-weight: bold;
            color: white;
        }

        .option-desc {
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .price-original {
            color: #94a3b8;
            text-decoration: line-through;
            font-size: 0.8rem;
        }

        .price-sale {
            color: #4ade80;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: white;
            margin: 12px 0;
        }

        .star-rating {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .star {
            color: #334155;
        }

        .star.active {
            color: #ffd700;
        }

        .btn-buy {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #64748b;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>⚡ ELIXIR SB STORE ⚡</h1>
    <div class="tagline">JOKI SBC • VTF • SOUTHBRONX | SCRIPT ELIXIRPROJECTION | AKUN TIER</div>
    <div class="social-header">
        <a href="https://discord.gg/CxbDP6QmW" target="_blank" class="social-icon discord">🎮 Join Discord</a>
        <a href="https://www.tiktok.com/@not_elixir" target="_blank" class="social-icon tiktok">📱 TikTok @not_elixir</a>
    </div>
</div>

<div class="tab-container">
    <div class="tab-buttons">
        <button class="tab-btn active" data-tab="tab1">🎯 JOKI SBC</button>
        <button class="tab-btn" data-tab="tab2">💻 SCRIPT</button>
        <button class="tab-btn" data-tab="tab3">⭐ AKUN TIER</button>
    </div>

    <div id="tab1" class="tab-panel active-panel">
        <h2 class="section-title">💰 LIST HARGA JOKI SBC 💰</h2>
        <div class="grid" id="jokiGrid"></div>
    </div>

    <div id="tab2" class="tab-panel">
        <h2 class="section-title">💻 SCRIPT ELIXIRPROJECTION 💻</h2>
        <div class="grid" id="scriptGrid"></div>
    </div>

    <div id="tab3" class="tab-panel">
        <h2 class="section-title">⭐ AKUN TIER ⭐</h2>
        <div class="grid" id="tierGrid"></div>
    </div>
</div>

<div class="footer">
    © 2025 ELIXIR SB STORE | Order via WhatsApp | Harga dapat berubah
</div>

<script>
    const waNumber = "62895385984764";

    const jokiData = [
        { name: "SBC 100K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 12000, originalPrice: 25000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 25000, originalPrice: null }] },
        { name: "SBC 200K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 20000, originalPrice: 35000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 35000, originalPrice: null }] },
        { name: "SBC 300K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 30000, originalPrice: 65000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 65000, originalPrice: null }] },
        { name: "SBC 400K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 40000, originalPrice: 80000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 80000, originalPrice: null }] },
        { name: "SBC 500K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 50000, originalPrice: 100000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 100000, originalPrice: null }] },
        { name: "SBC 600K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 60000, originalPrice: 120000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 120000, originalPrice: null }] },
        { name: "SBC 700K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 70000, originalPrice: 140000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 140000, originalPrice: null }] },
        { name: "SBC 800K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 80000, originalPrice: 160000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 160000, originalPrice: null }] },
        { name: "SBC 900K", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 90000, originalPrice: 180000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 180000, originalPrice: null }] },
        { name: "SBC 1JT", options: [{ title: "⚡ NO DELAY", desc: "VIA TRANSFER IN GAME", price: 100000, originalPrice: 200000 }, { title: "🐢 REGULER", desc: "VIA TRANSFER IN GAME", price: 200000, originalPrice: null }] }
    ];

    const scriptData = [
        { name: "MARSHMALLOW", type: "HARIAN", price: 13000, originalPrice: 25000 },
        { name: "MARSHMALLOW", type: "BULANAN", price: 60000, originalPrice: 100000 },
        { name: "MARSHMALLOW", type: "LIFETIME", price: 150000, originalPrice: 250000 },
        { name: "COMBAT", type: "HARIAN", price: 20000, originalPrice: 35000 },
        { name: "COMBAT", type: "BULANAN", price: 80000, originalPrice: 150000 },
        { name: "COMBAT", type: "LIFETIME", price: 200000, originalPrice: 350000 },
        { name: "FPS", type: "LIFETIME", price: 50000, originalPrice: 100000 }
    ];

    const tierData = [
        { name: "TIER 1", color: "GREEN NAME", price: 150000 },
        { name: "TIER 2", color: "PINK NAME", price: 250000 },
        { name: "TIER 3", color: "BLUE NAME", price: 350000 }
    ];

    function formatRupiah(amount) {
        return "Rp" + amount.toLocaleString('id-ID');
    }

    function openWhatsApp(productName, optionName, price, nickname, rating) {
        const message = `Halo%20ELIXIR%20SB%20STORE%0A%0A📦%20*PESANAN%20BARU*%0A━━━━━━━━━━━━━━━━━━%0A📍%20Produk%3A%20${encodeURIComponent(productName)}%0A⚡%20Paket%3A%20${encodeURIComponent(optionName)}%0A💰%20Total%3A%20${encodeURIComponent(formatRupiah(price))}%0A👤%20Nickname%3A%20${encodeURIComponent(nickname || '-')}%0A⭐%20Rating%3A%20${encodeURIComponent(rating || '-')}%0A━━━━━━━━━━━━━━━━━━%0A%0A✅%20Saya%20sudah%20transfer.%20Berikut%20bukti%20transfernya%3A`;
        window.open(`https://wa.me/${waNumber}?text=${message}`, '_blank');
    }

    // Render JOKI
    const jokiContainer = document.getElementById('jokiGrid');
    let jokiHTML = "";
    jokiData.forEach(product => {
        let optionsHTML = "";
        product.options.forEach(opt => {
            optionsHTML += `<div class="option-item" data-product="${product.name}" data-option="${opt.title}" data-price="${opt.price}">
                <div class="option-title">${opt.title}</div>
                <div class="option-desc">${opt.desc}</div>
                <div class="price-row">${opt.originalPrice ? `<span class="price-original">${formatRupiah(opt.originalPrice)}</span>` : ""}<span class="price-sale">${formatRupiah(opt.price)}</span></div>
            </div>`;
        });
        jokiHTML += `<div class="card"><div class="card-header"><div class="product-title">🎯 ${product.name}</div><div class="rating">⭐⭐⭐⭐⭐ <span>5 (4 ulasan)</span></div></div><div class="card-body">${optionsHTML}<input type="text" class="input-field nickname" placeholder="📝 Nickname kamu..."><div class="star-rating"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div><button class="btn-buy">💳 BELI SEKARANG</button></div></div>`;
    });
    jokiContainer.innerHTML = jokiHTML;

    // Render SCRIPT
    const scriptContainer = document.getElementById('scriptGrid');
    let scriptHTML = "";
    scriptData.forEach(script => {
        scriptHTML += `<div class="card"><div class="card-header"><div class="product-title">💻 SCRIPT ${script.name}</div><div class="rating">⭐⭐⭐⭐⭐ <span>${script.type === "LIFETIME" ? "5 (8 ulasan)" : "4 (3 ulasan)"}</span></div></div><div class="card-body"><div class="option-item" data-product="SCRIPT ${script.name}" data-option="${script.type}" data-price="${script.price}" style="cursor:default"><div class="option-title">${script.type === "HARIAN" ? "📆" : script.type === "BULANAN" ? "📅" : "♾️"} ${script.type}</div><div class="price-row">${script.originalPrice ? `<span class="price-original">${formatRupiah(script.originalPrice)}</span>` : ""}<span class="price-sale">${formatRupiah(script.price)}</span></div></div><input type="text" class="input-field nickname" placeholder="📝 Nickname kamu..."><div class="star-rating"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div><button class="btn-buy">💳 BELI SEKARANG</button></div></div>`;
    });
    scriptContainer.innerHTML = scriptHTML;

    // Render TIER
    const tierContainer = document.getElementById('tierGrid');
    let tierHTML = "";
    tierData.forEach(tier => {
        tierHTML += `<div class="card"><div class="card-header"><div class="product-title">⭐ ${tier.name}</div><div class="rating">⭐⭐⭐⭐⭐ <span>5 (12 ulasan)</span></div></div><div class="card-body"><div class="option-item" data-product="${tier.name}" data-option="${tier.color}" data-price="${tier.price}" style="cursor:default"><div class="option-title">${tier.color}</div><div class="price-row"><span class="price-sale">${formatRupiah(tier.price)}</span></div></div><input type="text" class="input-field nickname" placeholder="📝 Nickname kamu..."><div class="star-rating"><span class="star" data-value="1">★</span><span class="star" data-value="2">★</span><span class="star" data-value="3">★</span><span class="star" data-value="4">★</span><span class="star" data-value="5">★</span></div><button class="btn-buy">💳 BELI SEKARANG</button></div></div>`;
    });
    tierContainer.innerHTML = tierHTML;

    // Event Listeners
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active-panel'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active-panel');
        });
    });

    document.querySelectorAll('.card').forEach(card => {
        card.querySelectorAll('.option-item').forEach(opt => {
            opt.addEventListener('click', () => {
                card.querySelectorAll('.option-item').forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
            });
        });

        card.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function() {
                const val = parseInt(this.dataset.value);
                const stars = this.closest('.star-rating').querySelectorAll('.star');
                stars.forEach((s, i) => i < val ? s.classList.add('active') : s.classList.remove('active'));
            });
        });

        card.querySelector('.btn-buy').addEventListener('click', () => {
            const selected = card.querySelector('.option-item.selected');
            if (!selected) { alert('Pilih metode dulu!'); return; }
            const product = selected.dataset.product;
            const option = selected.dataset.option;
            const price = parseInt(selected.dataset.price);
            const nickname = card.querySelector('.nickname')?.value || '';
            const starContainer = card.querySelector('.star-rating');
            const activeStars = starContainer.querySelectorAll('.star.active').length;
            openWhatsApp(product, option, price, nickname, activeStars || 5);
        });
    });
</script>
</body>
</html>
