<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELIXIR SB STORE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: #0f172a;
            padding: 20px;
        }
        .header {
            text-align: center;
            background: #1e293b;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #ffd700;
            font-size: 28px;
        }
        .social {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .social a {
            background: #334155;
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        .rp {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }
        .harga {
            font-size: 28px;
            font-weight: bold;
            color: #4ade80;
            margin: 10px 0;
        }
        .btn {
            display: block;
            background: #25D366;
            color: white;
            padding: 12px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
        }
        .footer {
            text-align: center;
            color: #64748b;
            margin-top: 40px;
            padding: 20px;
        }
        h2 {
            color: #ffd700;
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>⚡ ELIXIR SB STORE ⚡</h1>
    <p style="color:#94a3b8; margin-top:8px;">JOKI SBC • VTF • SOUTHBRONX</p>
    <div class="social">
        <a href="https://discord.gg/CxbDP6QmW" target="_blank">🎮 Join Discord</a>
        <a href="https://www.tiktok.com/@not_elixir" target="_blank">📱 TikTok</a>
    </div>
</div>

<h2>💰 LIST HARGA JOKI 💰</h2>

<div class="grid" id="daftar"></div>

<div class="footer">
    © 2025 ELIXIR SB STORE | Order via WhatsApp
</div>

<script>
    const produk = [
        { rp: "100K", harga: 10000 },
        { rp: "200K", harga: 20000 },
        { rp: "300K", harga: 30000 },
        { rp: "400K", harga: 40000 },
        { rp: "500K", harga: 50000 },
        { rp: "600K", harga: 60000 },
        { rp: "700K", harga: 70000 },
        { rp: "800K", harga: 80000 },
        { rp: "900K", harga: 90000 },
        { rp: "1JT", harga: 100000 },
        { rp: "1.1 JT", harga: 110000 },
        { rp: "1.2 JT", harga: 120000 },
        { rp: "1.3 JT", harga: 130000 },
        { rp: "1.4 JT", harga: 140000 },
        { rp: "1.5 JT", harga: 150000 },
        { rp: "1.6 JT", harga: 160000 },
        { rp: "1.7 JT", harga: 170000 }
    ];

    function formatHarga(angka) {
        return "Rp" + angka.toLocaleString('id-ID');
    }

    const container = document.getElementById('daftar');
    
    for (let i = 0; i < produk.length; i++) {
        const item = produk[i];
        const linkWA = "https://wa.me/62895385984764?text=Halo%20ELIXIR%20SB%20STORE%2C%20saya%20mau%20order%20joki%20" + item.rp + "%20RP%20harga%20" + formatHarga(item.harga);
        
        const card = '<div class="card">' +
            '<div class="rp">🎯 ' + item.rp + ' RP</div>' +
            '<div class="harga">' + formatHarga(item.harga) + '</div>' +
            '<a href="' + linkWA + '" class="btn" target="_blank">💬 Order via WA</a>' +
            '</div>';
        
        container.innerHTML = container.innerHTML + card;
    }
</script>

</body>
</html>
