<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ELIXIR SB STORE</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome (minimal) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0a0a0f] to-[#120c1c]">

    <!-- GLOW BACKGROUND -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
        <div class="absolute top-20 left-1/4 w-96 h-96 bg-purple-700 rounded-full blur-[120px] opacity-20"></div>
        <div class="absolute bottom-20 right-1/4 w-80 h-80 bg-pink-600 rounded-full blur-[100px] opacity-10"></div>
    </div>

    <!-- HEADER -->
    <div class="relative z-10 max-w-6xl mx-auto px-5 pt-8" data-aos="fade-down">
        <div class="text-center">
            <div class="inline-flex items-center gap-2 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl px-5 py-2.5 mb-5">
                <div class="w-8 h-8 bg-gradient-to-br from-purple-500 to-purple-700 rounded-lg flex items-center justify-center">
                    <i class="fas fa-bolt text-yellow-400 text-xs"></i>
                </div>
                <span class="text-white font-semibold tracking-wide text-sm">ELIXIR SB STORE</span>
            </div>
            <div class="flex justify-center gap-3 flex-wrap">
                <a href="https://discord.gg/CxbDP6QmW" target="_blank" class="flex items-center gap-2 px-5 py-2 bg-white/5 border border-white/10 rounded-full text-white/60 hover:text-white hover:border-purple-500/50 transition-all text-sm">
                    <i class="fab fa-discord text-[#5865F2]"></i> Discord
                </a>
                <a href="https://www.tiktok.com/@not_elixir" target="_blank" class="flex items-center gap-2 px-5 py-2 bg-white/5 border border-white/10 rounded-full text-white/60 hover:text-white hover:border-purple-500/50 transition-all text-sm">
                    <i class="fab fa-tiktok text-pink-400"></i> TikTok
                </a>
            </div>
        </div>
    </div>

    <!-- TABS -->
    <div class="relative z-10 max-w-6xl mx-auto px-5 mt-10">
        <div class="flex justify-center gap-2 mb-10">
            <button data-tab="joki" class="tab-btn active-tab px-6 py-2.5 rounded-full text-sm font-medium transition-all bg-purple-600 text-white shadow-md shadow-purple-500/25">Joki SBC</button>
            <button data-tab="script" class="tab-btn px-6 py-2.5 rounded-full text-sm font-medium transition-all bg-white/5 text-white/60 hover:text-white">Script</button>
            <button data-tab="tier" class="tab-btn px-6 py-2.5 rounded-full text-sm font-medium transition-all bg-white/5 text-white/60 hover:text-white">Akun Tier</button>
        </div>

        <!-- JOKI TAB -->
        <div id="jokiTab" class="tab-content">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="jokiGrid"></div>
        </div>

        <!-- SCRIPT TAB -->
        <div id="scriptTab" class="tab-content hidden">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="scriptGrid"></div>
        </div>

        <!-- TIER TAB -->
        <div id="tierTab" class="tab-content hidden">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="tierGrid"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="relative z-10 text-center py-8 mt-12 border-t border-white/5 text-white/30 text-xs">
        © 2025 ELIXIR SB STORE
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 500, once: true });

        const waNumber = "62895385984764";
        const formatRp = (n) => "Rp" + n.toLocaleString('id-ID');

        // DATA
        const jokiList = [
            "100K","200K","300K","400K","500K",
            "600K","700K","800K","900K","1JT",
            "1.1 JT","1.2 JT","1.3 JT","1.4 JT","1.5 JT","1.6 JT","1.7 JT"
        ];
        const jokiHarga = [12000,20000,30000,40000,50000,60000,70000,80000,90000,100000,110000,120000,130000,140000,150000,160000,170000];

        const scriptList = [
            { name:"MARSHMALLOW - HARIAN", price:13000 },
            { name:"MARSHMALLOW - BULANAN", price:60000 },
            { name:"MARSHMALLOW - LIFETIME", price:150000 },
            { name:"COMBAT - HARIAN", price:20000 },
            { name:"COMBAT - BULANAN", price:80000 },
            { name:"COMBAT - LIFETIME", price:200000 },
            { name:"FPS - LIFETIME", price:50000 }
        ];

        const tierList = [
            { name:"TIER 1 - GREEN", price:150000 },
            { name:"TIER 2 - PINK", price:250000 },
            { name:"TIER 3 - BLUE", price:350000 }
        ];

        function sendWA(product, price, nickname, rating) {
            const msg = `Halo ELIXIR SB STORE%0A%0AProduk: ${encodeURIComponent(product)}%0AHarga: ${encodeURIComponent(formatRp(price))}%0ANickname: ${encodeURIComponent(nickname || '-')}%0ARating: ${rating || 5}⭐%0A%0ABukti transfer: (kirim foto)`;
            window.open(`https://wa.me/${waNumber}?text=${msg}`, '_blank');
        }

        function createCard(title, price) {
            const card = document.createElement('div');
            card.className = "bg-white/5 backdrop-blur-md border border-white/10 rounded-2xl p-5 hover:border-purple-500/40 hover:-translate-y-1 transition-all duration-300";
            card.setAttribute('data-aos', 'fade-up');
            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-white font-medium text-base">${title}</h3>
                    <div class="flex items-center gap-0.5">
                        <i class="fas fa-star text-yellow-500 text-[10px]"></i>
                        <i class="fas fa-star text-yellow-500 text-[10px]"></i>
                        <i class="fas fa-star text-yellow-500 text-[10px]"></i>
                        <i class="fas fa-star text-yellow-500 text-[10px]"></i>
                        <i class="fas fa-star text-yellow-500 text-[10px]"></i>
                    </div>
                </div>
                <div class="mb-4">
                    <span class="text-2xl font-bold text-white">${formatRp(price)}</span>
                </div>
                <input type="text" class="nickname w-full bg-black/30 border border-white/10 rounded-xl px-4 py-2.5 text-white/80 text-sm placeholder:text-white/30 focus:outline-none focus:border-purple-500 transition-all mb-3" placeholder="Nickname">
                <div class="flex justify-center gap-3 mb-4 stars">
                    <i class="far fa-star text-white/30 text-lg cursor-pointer hover:text-yellow-500 transition" data-val="1"></i>
                    <i class="far fa-star text-white/30 text-lg cursor-pointer hover:text-yellow-500 transition" data-val="2"></i>
                    <i class="far fa-star text-white/30 text-lg cursor-pointer hover:text-yellow-500 transition" data-val="3"></i>
                    <i class="far fa-star text-white/30 text-lg cursor-pointer hover:text-yellow-500 transition" data-val="4"></i>
                    <i class="far fa-star text-white/30 text-lg cursor-pointer hover:text-yellow-500 transition" data-val="5"></i>
                </div>
                <button class="buy w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-2.5 rounded-xl transition-all flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-sm"></i> Order
                </button>
            `;

            // Star logic
            const stars = card.querySelectorAll('.stars i');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const val = parseInt(star.dataset.val);
                    stars.forEach((s, i) => {
                        if (i < val) {
                            s.className = "fas fa-star text-yellow-500 text-lg cursor-pointer";
                        } else {
                            s.className = "far fa-star text-white/30 text-lg cursor-pointer hover:text-yellow-500 transition";
                        }
                    });
                });
            });

            // Buy logic
            const buyBtn = card.querySelector('.buy');
            const nicknameInput = card.querySelector('.nickname');
            buyBtn.addEventListener('click', () => {
                const nickname = nicknameInput.value;
                const active = card.querySelectorAll('.stars .fas').length;
                sendWA(title, price, nickname, active || 5);
            });

            return card;
        }

        // RENDER
        const jokiGrid = document.getElementById('jokiGrid');
        jokiList.forEach((name, i) => jokiGrid.appendChild(createCard(`SBC ${name}`, jokiHarga[i])));

        const scriptGrid = document.getElementById('scriptGrid');
        scriptList.forEach(s => scriptGrid.appendChild(createCard(`SCRIPT ${s.name}`, s.price)));

        const tierGrid = document.getElementById('tierGrid');
        tierList.forEach(t => tierGrid.appendChild(createCard(t.name, t.price)));

        // TAB SWITCH
        const tabs = document.querySelectorAll('.tab-btn');
        const contents = { joki: document.getElementById('jokiTab'), script: document.getElementById('scriptTab'), tier: document.getElementById('tierTab') };
        
        tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.tab;
                tabs.forEach(b => {
                    b.classList.remove('bg-purple-600', 'text-white', 'shadow-md', 'shadow-purple-500/25');
                    b.classList.add('bg-white/5', 'text-white/60');
                });
                btn.classList.remove('bg-white/5', 'text-white/60');
                btn.classList.add('bg-purple-600', 'text-white', 'shadow-md', 'shadow-purple-500/25');
                
                Object.keys(contents).forEach(key => contents[key].classList.add('hidden'));
                contents[target].classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
