    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        /* Background Animasi */
        @keyframes drift {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(-30px, 30px) rotate(10deg); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.15; }
            50% { opacity: 0.35; }
        }
        
        .bg-drift {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 40% 50%, rgba(168,85,247,0.12), transparent 60%);
            animation: drift 18s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }
        
        .bg-drift-2 {
            position: fixed;
            bottom: -20%;
            right: -10%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 60% 70%, rgba(59,130,246,0.08), transparent 70%);
            animation: drift 22s infinite alternate-reverse ease-in-out;
            pointer-events: none;
            z-index: 0;
        }
        
        .glow-pulse {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 50rem;
            height: 50rem;
            background: radial-gradient(circle, rgba(168,85,247,0.05), transparent);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 6s infinite ease-in-out;
            pointer-events: none;
            z-index: 0;
        }
        
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #0f0f1a; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
        
        .stat-value {
            background: linear-gradient(135deg, #fff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>
<body class="bg-[#0a0a0f] min-h-screen">

    <!-- BACKGROUND ANIMASI -->
    <div class="bg-drift"></div>
    <div class="bg-drift-2"></div>
    <div class="glow-pulse"></div>

    <!-- HEADER - TANPA LOGO ALAY -->
    <div class="relative z-20 max-w-6xl mx-auto px-6 pt-8 text-center" data-aos="fade-down">
        <div class="space-y-1">
            <div class="text-white font-bold text-2xl tracking-tight">
                ELIXIR<span class="text-purple-400">STORE</span>
            </div>
            <div class="text-[10px] text-purple-400/50 tracking-widest">ELITE GAMING SERVICE</div>
        </div>
    </div>

    <!-- HERO SECTION -->
    <div class="relative z-20 max-w-5xl mx-auto px-6 pt-20 pb-10 text-center" data-aos="fade-up" data-aos-duration="800">
        <div class="inline-block px-4 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-300 text-[11px] font-medium tracking-wider mb-5">
            <i class="fas fa-bolt mr-1 text-yellow-500"></i> PREMIUM GAMING MARKETPLACE
        </div>
        <h1 class="text-5xl md:text-6xl font-bold text-white mb-4 leading-[1.2]">
            <span class="bg-gradient-to-r from-white via-purple-200 to-purple-400 bg-clip-text text-transparent">ELIXIR60S</span>
        </h1>
        <p class="text-white/40 max-w-md mx-auto text-sm mb-8">
            Joki SBC • Script Premium • Akun Tier • Fast Response 24/7
        </p>
        <div class="flex justify-center gap-4">
            <a href="#marketplace" class="px-7 py-3 bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-500 hover:to-purple-600 text-white rounded-xl font-semibold transition-all flex items-center gap-2 shadow-lg shadow-purple-500/20 text-sm">
                <i class="fas fa-store"></i> Explore Items
            </a>
            <a href="https://discord.gg/CxbDP6QmW" target="_blank" class="px-7 py-3 bg-white/5 border border-white/10 hover:border-purple-500/50 text-white/70 rounded-xl font-semibold transition-all flex items-center gap-2 text-sm">
                <i class="fab fa-discord"></i> Discord
            </a>
            <a href="https://wa.me/62895385984764?text=Halo%20ELIXIRSTORE%2C%20saya%20mau%20order" target="_blank" class="px-7 py-3 bg-white/5 border border-white/10 hover:border-green-500/50 text-white/70 rounded-xl font-semibold transition-all flex items-center gap-2 text-sm">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>
    </div>

    <!-- STATS -->
    <div class="relative z-20 max-w-4xl mx-auto px-6 py-10">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
            <div class="bg-white/5 backdrop-blur-sm rounded-2xl py-5 border border-white/5">
                <div class="text-3xl font-black stat-value">17</div>
                <div class="text-white/40 text-[11px] uppercase tracking-wider mt-1">PRODUK</div>
            </div>
            <div class="bg-white/5 backdrop-blur-sm rounded-2xl py-5 border border-white/5">
                <div class="text-3xl font-black stat-value">100+</div>
                <div class="text-white/40 text-[11px] uppercase tracking-wider mt-1">TERJUAL</div>
            </div>
            <div class="bg-white/5 backdrop-blur-sm rounded-2xl py-5 border border-white/5">
                <div class="text-3xl font-black stat-value">12</div>
                <div class="text-white/40 text-[11px] uppercase tracking-wider mt-1">ULASAN</div>
            </div>
            <div class="bg-white/5 backdrop-blur-sm rounded-2xl py-5 border border-white/5">
                <div class="text-3xl font-black stat-value">24/7</div>
                <div class="text-white/40 text-[11px] uppercase tracking-wider mt-1">SUPPORT</div>
            </div>
        </div>
    </div>

    <!-- MARKETPLACE SECTION -->
    <div id="marketplace" class="relative z-20 max-w-6xl mx-auto px-6 py-8">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-cubes text-purple-400 text-lg"></i> 
                    <span>Koleksi Item</span>
                </h2>
                <p class="text-white/30 text-xs mt-1">17 item tersedia</p>
            </div>
            <div class="relative w-full md:w-72">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-white/30 text-xs"></i>
                <input type="text" id="searchInput" placeholder="Cari item..." class="w-full bg-white/5 border border-white/10 rounded-full py-2.5 pl-10 pr-4 text-white/70 text-sm focus:outline-none focus:border-purple-500/50 transition-all">
            </div>
        </div>

        <!-- FILTER BUTTONS -->
        <div class="flex flex-wrap gap-2 mb-10">
            <button data-filter="all" class="filter-btn active-filter px-5 py-2 rounded-full text-xs font-medium transition-all bg-purple-600 text-white">Semua</button>
            <button data-filter="sbc" class="filter-btn px-5 py-2 rounded-full text-xs font-medium transition-all bg-white/5 text-white/50 hover:text-white">SBC</button>
            <button data-filter="script" class="filter-btn px-5 py-2 rounded-full text-xs font-medium transition-all bg-white/5 text-white/50 hover:text-white">Script</button>
            <button data-filter="tier" class="filter-btn px-5 py-2 rounded-full text-xs font-medium transition-all bg-white/5 text-white/50 hover:text-white">Akun Tier</button>
        </div>

        <!-- PRODUCT GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="productGrid"></div>
    </div>

    <!-- FOOTER -->
    <div class="relative z-20 text-center py-8 mt-8 border-t border-white/5">
        <div class="text-white/20 text-[10px] tracking-wider">
            <i class="far fa-copyright"></i> 2025 ELIXIRSTORE — ELITE GAMING SERVICE
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 500, once: true });

        const waNumber = "62895385984764";
        const formatRp = (n) => "Rp" + n.toLocaleString('id-ID');

        const products = [
            // SBC (17) - PAKAI NICKNAME
            ...["100K","200K","300K","400K","500K","600K","700K","800K","900K","1JT","1.1 JT","1.2 JT","1.3 JT","1.4 JT","1.5 JT","1.6 JT","1.7 JT"].map((name, idx) => ({
                name: `SBC ${name}`,
                price: [12000,20000,30000,40000,50000,60000,70000,80000,90000,100000,110000,120000,130000,140000,150000,160000,170000][idx],
                category: "sbc",
                needNickname: true
            })),
            // SCRIPT - TANPA NICKNAME
            { name: "SCRIPT MARSHMALLOW - HARIAN", price: 13000, category: "script", needNickname: false },
            { name: "SCRIPT MARSHMALLOW - BULANAN", price: 60000, category: "script", needNickname: false },
            { name: "SCRIPT MARSHMALLOW - LIFETIME", price: 150000, category: "script", needNickname: false },
            { name: "SCRIPT COMBAT - HARIAN", price: 20000, category: "script", needNickname: false },
            { name: "SCRIPT COMBAT - BULANAN", price: 80000, category: "script", needNickname: false },
            { name: "SCRIPT COMBAT - LIFETIME", price: 200000, category: "script", needNickname: false },
            { name: "SCRIPT FPS - LIFETIME", price: 50000, category: "script", needNickname: false },
            // TIER - TANPA NICKNAME
            { name: "TIER 1 - GREEN NAME", price: 150000, category: "tier", needNickname: false },
            { name: "TIER 2 - PINK NAME", price: 250000, category: "tier", needNickname: false },
            { name: "TIER 3 - BLUE NAME", price: 350000, category: "tier", needNickname: false }
        ];

        function sendWA(product, price, nickname, rating) {
            let msg = `Halo ELIXIRSTORE%0A%0AProduk: ${encodeURIComponent(product)}%0AHarga: ${encodeURIComponent(formatRp(price))}`;
            if (nickname) msg += `%0ANickname: ${encodeURIComponent(nickname)}`;
            msg += `%0ARating: ${rating || 5}⭐%0A%0ABukti transfer: (kirim foto)`;
            window.open(`https://wa.me/${waNumber}?text=${msg}`, '_blank');
        }

        function createCard(product) {
            const card = document.createElement('div');
            card.className = 'bg-white/5 backdrop-blur-sm border border-white/10 rounded-2xl p-5 transition-all duration-300 hover:border-purple-500/40 hover:-translate-y-1';
            
            let nicknameHtml = '';
            if (product.needNickname) {
                nicknameHtml = `<input type="text" class="nickname w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-white/60 text-xs placeholder:text-white/20 focus:outline-none focus:border-purple-500 transition-all mb-3" placeholder="Nickname">`;
            }
            
            card.innerHTML = `
                <div class="flex items-center gap-2 mb-3">
                    <div class="w-7 h-7 rounded-lg bg-purple-500/15 flex items-center justify-center">
                        <i class="fas ${product.category === 'sbc' ? 'fa-bolt' : (product.category === 'script' ? 'fa-terminal' : 'fa-gem')} text-purple-400 text-xs"></i>
                    </div>
                    <h3 class="text-white font-medium text-sm flex-1">${product.name}</h3>
                </div>
                <div class="mb-4">
                    <span class="text-2xl font-bold text-white">${formatRp(product.price)}</span>
                </div>
                ${nicknameHtml}
                <div class="flex justify-center gap-2 mb-3 stars">
                    <i class="far fa-star text-white/30 text-sm cursor-pointer hover:text-yellow-500 transition" data-val="1"></i>
                    <i class="far fa-star text-white/30 text-sm cursor-pointer hover:text-yellow-500 transition" data-val="2"></i>
                    <i class="far fa-star text-white/30 text-sm cursor-pointer hover:text-yellow-500 transition" data-val="3"></i>
                    <i class="far fa-star text-white/30 text-sm cursor-pointer hover:text-yellow-500 transition" data-val="4"></i>
                    <i class="far fa-star text-white/30 text-sm cursor-pointer hover:text-yellow-500 transition" data-val="5"></i>
                </div>
                <button class="buy w-full bg-purple-600/70 hover:bg-purple-600 text-white font-medium py-2 rounded-xl transition-all text-sm flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp text-xs"></i> Order
                </button>
            `;

            const stars = card.querySelectorAll('.stars i');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const val = parseInt(star.dataset.val);
                    stars.forEach((s, i) => {
                        if (i < val) s.className = "fas fa-star text-yellow-500 text-sm cursor-pointer";
                        else s.className = "far fa-star text-white/30 text-sm cursor-pointer hover:text-yellow-500 transition";
                    });
                });
            });

            const buyBtn = card.querySelector('.buy');
            const nicknameInput = card.querySelector('.nickname');
            buyBtn.addEventListener('click', () => {
                const nickname = nicknameInput ? nicknameInput.value : '';
                const active = card.querySelectorAll('.stars .fas').length;
                sendWA(product.name, product.price, nickname, active || 5);
            });

            return card;
        }

        const productGrid = document.getElementById('productGrid');
        let currentFilter = 'all';
        let searchQuery = '';

        function render() {
            const filtered = products.filter(p => {
                if (currentFilter !== 'all' && p.category !== currentFilter) return false;
                if (searchQuery && !p.name.toLowerCase().includes(searchQuery.toLowerCase())) return false;
                return true;
            });
            productGrid.innerHTML = '';
            if (filtered.length === 0) {
                productGrid.innerHTML = '<div class="col-span-full text-center text-white/30 py-12 text-sm">Item tidak ditemukan 😢</div>';
                return;
            }
            filtered.forEach(p => productGrid.appendChild(createCard(p)));
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-purple-600', 'text-white');
                    b.classList.add('bg-white/5', 'text-white/50');
                });
                btn.classList.remove('bg-white/5', 'text-white/50');
                btn.classList.add('bg-purple-600', 'text-white');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        render();
    </script>
</body>
</html>
