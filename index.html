<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ELIXIR SB STORE - Premium Gaming Service</title>
    
    <!-- Tailwind CSS (Premium Library) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome 6 (Icon Library) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts - Plus Jakarta Sans (Premium Font) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- AOS Scroll Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Custom scroll bar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 10px; }
        
        /* Hide scroll for cleaner look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0a0a0f] via-[#1a0f2e] to-[#0b0716] min-h-screen">

    <!-- GLOW ORBS BACKGROUND -->
    <div class="fixed top-20 -left-20 w-72 h-72 bg-purple-600 rounded-full blur-[80px] opacity-20 pointer-events-none"></div>
    <div class="fixed bottom-20 -right-20 w-96 h-96 bg-yellow-500 rounded-full blur-[100px] opacity-10 pointer-events-none"></div>

    <!-- HEADER PREMIUM -->
    <div class="relative z-10 max-w-7xl mx-auto px-4 pt-6" data-aos="fade-down">
        <div class="text-center">
            <!-- Logo Area -->
            <div class="inline-flex items-center gap-3 bg-white/5 backdrop-blur-xl border border-purple-500/30 rounded-full px-6 py-3 mb-6">
                <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-purple-800 rounded-full flex items-center justify-center shadow-lg">
                    <i class="fas fa-crown text-yellow-400 text-sm"></i>
                </div>
                <div class="text-xl font-extrabold bg-gradient-to-r from-white to-purple-300 bg-clip-text text-transparent">
                    ELIXIR SB STORE
                </div>
            </div>
            
            <div class="text-purple-300/60 text-sm tracking-wider mb-5">PREMIUM GAMING SERVICE</div>
            
            <!-- Social Buttons -->
            <div class="flex justify-center gap-4 flex-wrap">
                <a href="https://discord.gg/CxbDP6QmW" target="_blank" class="inline-flex items-center gap-2 px-6 py-2.5 bg-white/5 backdrop-blur-sm border border-purple-500/30 rounded-full text-white/80 hover:bg-purple-600/20 hover:border-purple-400 transition-all duration-300">
                    <i class="fab fa-discord text-[#5865F2]"></i>
                    <span class="text-sm font-medium">Discord</span>
                </a>
                <a href="https://www.tiktok.com/@not_elixir" target="_blank" class="inline-flex items-center gap-2 px-6 py-2.5 bg-white/5 backdrop-blur-sm border border-purple-500/30 rounded-full text-white/80 hover:bg-purple-600/20 hover:border-purple-400 transition-all duration-300">
                    <i class="fab fa-tiktok text-pink-500"></i>
                    <span class="text-sm font-medium">TikTok</span>
                </a>
            </div>
        </div>
    </div>

    <!-- TABS -->
    <div class="relative z-10 max-w-7xl mx-auto px-4 mt-12" data-aos="fade-up">
        <div class="flex justify-center gap-3 flex-wrap mb-12">
            <button data-tab="joki" class="tab-btn active-tab inline-flex items-center gap-2 px-6 py-3 rounded-full text-sm font-semibold transition-all duration-300 bg-gradient-to-r from-purple-600 to-purple-800 text-white shadow-lg shadow-purple-500/30">
                <i class="fas fa-bolt"></i> JOKI SBC
            </button>
            <button data-tab="script" class="tab-btn inline-flex items-center gap-2 px-6 py-3 rounded-full text-sm font-semibold transition-all duration-300 bg-white/5 backdrop-blur-sm border border-purple-500/30 text-white/70 hover:bg-purple-600/20">
                <i class="fas fa-code"></i> SCRIPT
            </button>
            <button data-tab="tier" class="tab-btn inline-flex items-center gap-2 px-6 py-3 rounded-full text-sm font-semibold transition-all duration-300 bg-white/5 backdrop-blur-sm border border-purple-500/30 text-white/70 hover:bg-purple-600/20">
                <i class="fas fa-gem"></i> AKUN TIER
            </button>
        </div>

        <!-- TAB JOKI -->
        <div id="jokiTab" class="tab-content">
            <div class="text-center mb-8 flex items-center justify-center gap-3">
                <i class="fas fa-coins text-2xl text-yellow-500"></i>
                <h2 class="text-2xl font-bold bg-gradient-to-r from-purple-300 to-purple-100 bg-clip-text text-transparent">LIST HARGA JOKI SBC</h2>
                <i class="fas fa-coins text-2xl text-yellow-500"></i>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="jokiGrid"></div>
        </div>

        <!-- TAB SCRIPT -->
        <div id="scriptTab" class="tab-content hidden">
            <div class="text-center mb-8 flex items-center justify-center gap-3">
                <i class="fas fa-terminal text-2xl text-cyan-400"></i>
                <h2 class="text-2xl font-bold bg-gradient-to-r from-cyan-300 to-purple-300 bg-clip-text text-transparent">SCRIPT ELIXIRPROJECTION</h2>
                <i class="fas fa-terminal text-2xl text-cyan-400"></i>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="scriptGrid"></div>
        </div>

        <!-- TAB TIER -->
        <div id="tierTab" class="tab-content hidden">
            <div class="text-center mb-8 flex items-center justify-center gap-3">
                <i class="fas fa-trophy text-2xl text-yellow-500"></i>
                <h2 class="text-2xl font-bold bg-gradient-to-r from-yellow-300 to-purple-300 bg-clip-text text-transparent">AKUN TIER</h2>
                <i class="fas fa-trophy text-2xl text-yellow-500"></i>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tierGrid"></div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="relative z-10 text-center mt-20 py-6 border-t border-white/5 text-white/40 text-xs flex items-center justify-center gap-2">
        <i class="far fa-copyright"></i> 2025 ELIXIR SB STORE
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 600, once: true });

        const waNumber = "62895385984764";
        const formatRupiah = (n) => "Rp" + n.toLocaleString('id-ID');

        // Data JOKI (17 produk)
        const jokiPrices = [12000,20000,30000,40000,50000,60000,70000,80000,90000,100000,110000,120000,130000,140000,150000,160000,170000];
        const jokiNames = ["SBC 100K","SBC 200K","SBC 300K","SBC 400K","SBC 500K","SBC 600K","SBC 700K","SBC 800K","SBC 900K","SBC 1JT","SBC 1.1 JT","SBC 1.2 JT","SBC 1.3 JT","SBC 1.4 JT","SBC 1.5 JT","SBC 1.6 JT","SBC 1.7 JT"];

        // Data SCRIPT
        const scripts = [
            { name:"MARSHMALLOW", type:"HARIAN", price:13000, icon:"fa-calendar-day" },
            { name:"MARSHMALLOW", type:"BULANAN", price:60000, icon:"fa-calendar-alt" },
            { name:"MARSHMALLOW", type:"LIFETIME", price:150000, icon:"fa-infinity" },
            { name:"COMBAT", type:"HARIAN", price:20000, icon:"fa-calendar-day" },
            { name:"COMBAT", type:"BULANAN", price:80000, icon:"fa-calendar-alt" },
            { name:"COMBAT", type:"LIFETIME", price:200000, icon:"fa-infinity" },
            { name:"FPS", type:"LIFETIME", price:50000, icon:"fa-infinity" }
        ];

        // Data TIER
        const tiers = [
            { name:"TIER 1", color:"GREEN NAME", price:150000, icon:"fa-leaf" },
            { name:"TIER 2", color:"PINK NAME", price:250000, icon:"fa-heart" },
            { name:"TIER 3", color:"BLUE NAME", price:350000, icon:"fa-droplet" }
        ];

        // Fungsi buka WhatsApp
        function openWA(product, price, nickname, rating) {
            const msg = `Halo ELIXIR SB STORE%0A%0A📦 Produk: ${encodeURIComponent(product)}%0A💰 Total: ${encodeURIComponent(formatRupiah(price))}%0A👤 Nickname: ${encodeURIComponent(nickname || '-')}%0A⭐ Rating: ${rating || '-'}%0A%0A✅ Saya sudah transfer. Berikut buktinya:`;
            window.open(`https://wa.me/${waNumber}?text=${msg}`, '_blank');
        }

        // Render fungsi dengan star rating
        function createCard(productName, price, type, extra = null) {
            const cardDiv = document.createElement('div');
            cardDiv.className = "bg-white/5 backdrop-blur-lg border border-purple-500/20 rounded-2xl overflow-hidden hover:border-purple-500/50 transition-all duration-300 hover:-translate-y-1";
            cardDiv.setAttribute('data-aos', 'fade-up');
            
            let headerHtml = `<div class="p-5 border-b border-white/5 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <i class="fas ${type === 'joki' ? 'fa-bolt text-yellow-500' : (type === 'script' ? 'fa-code text-cyan-400' : 'fa-gem text-purple-400')}"></i>
                    <h3 class="font-bold text-white">${productName}</h3>
                </div>
                <div class="flex items-center gap-1 text-yellow-500 text-sm">
                    <i class="fas fa-star text-xs"></i> <span class="text-white/70 ml-1">5.0</span>
                </div>
            </div>`;
            
            let bodyHtml = `<div class="p-5">
                <div class="bg-black/30 rounded-xl p-4 mb-4">
                    <div class="flex items-center gap-2 text-purple-300 text-xs mb-2">
                        <i class="fas fa-tachometer-alt"></i> <span>NO DELAY</span>
                    </div>
                    <div class="flex items-baseline gap-1">
                        <span class="text-2xl font-bold text-yellow-500">${formatRupiah(price)}</span>
                        <span class="text-white/40 text-xs">/${type === 'script' ? 'Paket' : 'SBC'}</span>
                    </div>
                </div>
                <input type="text" class="nickname-input w-full bg-black/40 border border-purple-500/20 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-purple-500 transition-colors mb-4" placeholder="Nickname kamu...">
                <div class="flex justify-center gap-2 mb-5 star-container">
                    <i class="far fa-star text-2xl text-white/30 cursor-pointer hover:text-yellow-500 transition star" data-val="1"></i>
                    <i class="far fa-star text-2xl text-white/30 cursor-pointer hover:text-yellow-500 transition star" data-val="2"></i>
                    <i class="far fa-star text-2xl text-white/30 cursor-pointer hover:text-yellow-500 transition star" data-val="3"></i>
                    <i class="far fa-star text-2xl text-white/30 cursor-pointer hover:text-yellow-500 transition star" data-val="4"></i>
                    <i class="far fa-star text-2xl text-white/30 cursor-pointer hover:text-yellow-500 transition star" data-val="5"></i>
                </div>
                <button class="buy-btn w-full bg-gradient-to-r from-purple-600 to-purple-800 hover:from-purple-500 hover:to-purple-700 text-white font-semibold py-3 rounded-xl transition-all duration-300 flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp"></i> ORDER NOW
                </button>
            </div>`;
            
            cardDiv.innerHTML = headerHtml + bodyHtml;
            
            // Star rating logic
            const stars = cardDiv.querySelectorAll('.star');
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const val = parseInt(this.dataset.val);
                    stars.forEach((s, i) => {
                        if (i < val) {
                            s.classList.remove('far');
                            s.classList.add('fas', 'active', 'text-yellow-500');
                        } else {
                            s.classList.remove('fas', 'active', 'text-yellow-500');
                            s.classList.add('far');
                        }
                    });
                });
            });
            
            // Buy button logic
            const buyBtn = cardDiv.querySelector('.buy-btn');
            const nicknameInput = cardDiv.querySelector('.nickname-input');
            buyBtn.addEventListener('click', () => {
                const nickname = nicknameInput.value;
                const activeStars = cardDiv.querySelectorAll('.star.fas.active').length;
                openWA(productName, price, nickname, activeStars || 5);
            });
            
            return cardDiv;
        }

        // Render JOKI
        const jokiGrid = document.getElementById('jokiGrid');
        jokiNames.forEach((name, idx) => {
            jokiGrid.appendChild(createCard(name, jokiPrices[idx], 'joki'));
        });
        
        // Render SCRIPT
        const scriptGrid = document.getElementById('scriptGrid');
        scripts.forEach(script => {
            scriptGrid.appendChild(createCard(`SCRIPT ${script.name} - ${script.type}`, script.price, 'script'));
        });
        
        // Render TIER
        const tierGrid = document.getElementById('tierGrid');
        tiers.forEach(tier => {
            tierGrid.appendChild(createCard(`${tier.name} (${tier.color})`, tier.price, 'tier'));
        });

        // TAB SWITCHING
        const tabs = document.querySelectorAll('.tab-btn');
        const contents = {
            joki: document.getElementById('jokiTab'),
            script: document.getElementById('scriptTab'),
            tier: document.getElementById('tierTab')
        };
        
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.tab;
                // Update button styles
                tabs.forEach(t => {
                    t.classList.remove('active-tab', 'bg-gradient-to-r', 'from-purple-600', 'to-purple-800', 'text-white', 'shadow-lg', 'shadow-purple-500/30');
                    t.classList.add('bg-white/5', 'backdrop-blur-sm', 'border', 'border-purple-500/30', 'text-white/70');
                });
                tab.classList.remove('bg-white/5', 'backdrop-blur-sm', 'border', 'border-purple-500/30', 'text-white/70');
                tab.classList.add('active-tab', 'bg-gradient-to-r', 'from-purple-600', 'to-purple-800', 'text-white', 'shadow-lg', 'shadow-purple-500/30');
                
                // Show/hide content
                Object.keys(contents).forEach(key => {
                    contents[key].classList.add('hidden');
                });
                contents[target].classList.remove('hidden');
            });
        });
    </script>
</body>
</html>
